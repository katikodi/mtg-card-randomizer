<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random MTG Card</title>
    <link rel="preload" as="image" href="src/card-image-loading.png" fetchpriority="high"> <!-- henter bilde før rendring -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600&family=League+Spartan:wght@200&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Random MTG</h1>
        
        <div id="filters">
            <h3>Show only:</h3>
            <div id="all-filters">
                <div id="filter-1">
                    <input type="checkbox" name="legal-standard" id="legal-standard">
                    <label for="legal-standard" class="filter-label">Legal in Standard</label>
                </div>
                <div id="filter-2">
                    <input type="checkbox" name="legal-commander" id="legal-commander">
                    <label for="legal-commander" class="filter-label">Legal in Commander</label>
                </div>
                <div id="filter-3">
                    <input type="checkbox" name="legal-commander" id="legal-commander">
                    <label for="legal-commander" class="filter-label">Valid commander</label>
                </div>
            </div>
        </div>
    </header>
    <input type="text" id="query">
    <main>
        <button id="get-random-btn">Get random card</button>
        <div id="main-container">
            <div id="random-card-container">
                <img id="image" src="src/card-image-loading.png"alt=""> 
            </div>
            <div id="divider"></div>
            <div id="card-attributes-container">
                <div id="card-title-container"></div>
            </div>
        </div>
    </main>
</body>
</html>
